plugins { id 'com.android.application' }
android {
    namespace 'com.lockin.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lockin.game'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '0.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn rootProject.tasks.named('validateContent')
}
